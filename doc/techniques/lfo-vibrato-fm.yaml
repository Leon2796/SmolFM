technique:
  name: lfo-vibrato-fm

  idea: |
    A sine LFO oscillator drives the proportional FM stage, and the FM output
    steers the carrier's note input.  Because the FM stage computes
    out = f_in * (1 + amount * modulator), the vibrato depth scales with the
    played note, so the wobble stays a fixed musical interval band on every
    key.  The LFO rate sets the trill speed and the amount sets its width -
    the classic expressive vibrato of a lead voice.

  tutorial: |
    Vibrato — das klassische expressive Sing-Spiel der Streicher- und
    Lead-Literatur: eine Sinus-LFO wischt periodisch um die Tonhöhe, und
    die Breite bleibt pro Taste ein festes musikalisches Intervall. Wofür
    dient die Verdrahtung? Die Sinus-LFO läuft in den Modulator-Eingang
    der FM-Stufe, deren Ausgang die Carrier-Note steuert; der FM-Mittlung
    out = f·(1 + amount·LFO) macht die Wobble-Breite proportional zur
    gespielten Note. Was ist das Ziel? Lebendige Leads: unter 2 Hz ein
    langsames Tonhöhen-Atmen, in der Mitte das klassische Vibrato-Trill
    (Rate = LFO, Breite = Amount), breit aufgedreht jammert es sirren-
    artig über den Halbton hinaus. Der Gang des Signals: (1) Die Note
    speist die FM-Mitte. (2) Die Sinus-LFO gibt das periodische
    Modulationssignal — der Takt ist die Rate, nicht die Uhr irgendeines
    Zufalls. (3) Die FM-Stufe wandelt in tastenproportionale Tonhöhe.
    (4) Der Carrier rendert die schwingende Wellenform, der Ausgang
    übernimmt. Verwandt: perlin-drift-modulation speist denselben
    Anschlüsse mit Nicht-Wiederhol-Drift statt festem Takt; eine LFO
    kann mehrere FM-Stufen speisen, für gleiche Vibrato über ganze
    Stimmen-Gruppen.

  involved_nodes:
    - type: note
      role: MIDI note source; carrier frequency for the FM stage.
    - type: osc
      role: Vibrato oscillator in LFO mode with sine waveform; the periodic
        modulation source.
    - type: fm
      role: Proportional FM stage; turns the vibrato into a note-scaled pitch
        deviation.
    - type: osc
      role: Carrier oscillator in pitch mode; renders the vibratoed
        frequency.
    - type: output
      role: Summing endpoint.

  involved_ports:
    - node_role: MIDI note source
      port: out
      role: Base frequency into the FM stage (frequency).
    - node_role: Vibrato oscillator
      port: out
      role: Periodic modulator signal into the FM stage (signal).
    - node_role: FM stage
      port: freq_in
      role: Receives the note frequency (frequency).
    - node_role: FM stage
      port: modulator_in
      role: Receives the vibrato signal (signal).
    - node_role: FM stage
      port: out
      role: Vibrato-modulated frequency towards the carrier (frequency).
    - node_role: Carrier oscillator
      port: note_in
      role: Receives the modulated frequency (frequency).
    - node_role: Carrier oscillator
      port: out
      role: Rendered signal towards the output (signal).
    - node_role: Master output
      port: in1..in8
      role: One mix input for the voice (signal).

  topology:
    description: |
      note -> fm.freq_in (frequency).  Vibrato oscillator (LFO mode, sine)
      -> fm.modulator_in (signal).  fm.out -> carrier.note_in (frequency).
      carrier.out -> output (signal).  The vibrato source runs free of the
      note; the proportional FM stage scales its depth to the played key.

  graph_ascii: |
      (note) ──out──▶ (fm.freq_in) ──out──▶ (osc · carrier.note_in) ──out──▶ (output)
      (osc · sine LFO) ──out──▶ (fm.modulator_in)      depth = amount × note · rate = speed

  parameters:
    - name: lfo rate
      role: |
        Vibrato speed, 0.01..50 Hz.  5..8 Hz is the classic lead vibrato,
        below 2 Hz reads as a slow pitch sway.
    - name: fm amount
      role: |
        Modulation index, 0..10.  Small values keep the trill inside a
        semitone; larger values open it into a wailing siren.
    - name: lfo waveform
      role: |
        Sine is the classic vibrato shape; triangle leans with straight
        slopes for a softer, more mechanical wobble.
    - name: carrier waveform
      role: |
        Rendered waveform of the vibratoed voice.

  relationships:
    - name: proportional-depth
      description: |
        The deviation equals amount times the note frequency, so the vibrato
        band stays the same musical width around any key instead of a fixed
        Hz band.
    - name: periodic-sibling
      description: |
        perlin-drift-modulation feeds the same socket with a noise-family
        LFO for non-repeating drift; the sine here locks the cycle into a
        periodic trill.  Both share the wiring, the character differs.
    - name: budget
      description: |
        Registry budgets: note = 1, osc <= 8, fm <= 4, output = 1.  One
        vibrato stage per voice; the LFO can fan out into several FM stages
        for correlated vibrato across voices.

  perceptual_effects:
    - expressive sine vibrato on leads and strings
    - slow pitch sway below 2 Hz
    - siren-like wailing when the amount opens past a semitone
