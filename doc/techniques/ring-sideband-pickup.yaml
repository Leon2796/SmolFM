technique:
  name: ring-sideband-pickup

  idea: |
    Two key-locked voices - the played note and an fscale-scaled interval
    copy - feed a ring modulator, whose output carries only the sum and the
    difference sideband.  A bandpass filter picks exactly one sideband: its
    cutoff is tracked by a second scale stage at the sum factor, so the
    clangorous ring product collapses into one clean, melodic, inharmonic
    tone that stays locked to the key.

  involved_nodes:
    - type: note
      role: Keyboard send; the pitch reference for both ring inputs and the
        tracked cutoff.
    - type: fscale
      role: Interval scale stage; factor r places the interval voice.
    - type: fscale
      role: Sum-sideband scale stage; factor 1 + r tracks the picked
        sideband.
    - type: osc
      role: Fundamental voice in pitch mode; first ring input.
    - type: osc
      role: Interval voice in pitch mode; second ring input.
    - type: ring
      role: Sample-wise multiplier; its output keeps sum and difference
        sidebands only.
    - type: filter
      role: Bandpass stage; its key-tracked cutoff selects the sum
        sideband.
    - type: output
      role: Summing endpoint.

  involved_ports:
    - node_role: Keyboard send
      port: out
      role: Base frequency fan-out into the fundamental voice and both
        scale stages (frequency).
    - node_role: Interval scale stage
      port: freq_in
      role: Receives the base frequency (frequency).
    - node_role: Interval scale stage
      port: out
      role: Interval frequency into the interval voice (frequency).
    - node_role: Sum-sideband scale stage
      port: freq_in
      role: Receives the base frequency (frequency).
    - node_role: Sum-sideband scale stage
      port: out
      role: Sum-sideband frequency into the tracked cutoff (frequency).
    - node_role: Fundamental oscillator
      port: note_in
      role: Receives the base frequency (frequency).
    - node_role: Fundamental oscillator
      port: out
      role: Fundamental signal into the ring modulator (signal).
    - node_role: Interval oscillator
      port: note_in
      role: Receives the interval frequency (frequency).
    - node_role: Interval oscillator
      port: out
      role: Interval signal into the ring modulator (signal).
    - node_role: Ring modulator
      port: in1
      role: Receives the fundamental signal (signal).
    - node_role: Ring modulator
      port: in2
      role: Receives the interval signal (signal).
    - node_role: Ring modulator
      port: out
      role: Sideband pair towards the pickup filter (signal).
    - node_role: Sideband filter
      port: cutoff_mod_in
      role: Receives the tracked sum-sideband frequency; replaces the
        static cutoff (frequency).
    - node_role: Sideband filter
      port: in
      role: Receives the ring product (signal).
    - node_role: Sideband filter
      port: out
      role: Picked sideband tone towards the output (signal).
    - node_role: Master output
      port: in1..in8
      role: Dedicated mix input for the picked tone (signal).

  topology:
    description: |
      note.out -> osc-a.note_in (frequency); note.out -> fscale1.freq_in
      (factor r), fscale1.out -> osc-b.note_in (frequency).  osc-a.out ->
      ring.in1 (signal); osc-b.out -> ring.in2 (signal).  ring.out ->
      filter.in (signal).  note.out -> fscale2.freq_in (factor 1 + r),
      fscale2.out -> filter.cutoff_mod_in (frequency).  filter.out ->
      output (signal).  The filter runs in bp mode; resonance sharpens
      the pick.

  parameters:
    - name: interval factor
      role: |
        First scale stage factor r, 0..10.  1.5 places the sum sideband at
        2.5x the played note; 2.5 places it at 3.5x - arbitrary values turn
        the pickup into a tunable inharmonic partial.
    - name: tracking factor
      role: |
        Second scale stage factor, 0..10; it must equal 1 + r so the band
        cutoff rides exactly on the sum sideband on every key.
    - name: resonance
      role: |
        Filter resonance, 0..1.  Higher values narrow the pick and reject
        the difference sideband more decisively.
    - name: voice waveforms
      role: |
        Sine inputs give one sideband pair; saw or square inputs raise full
        sideband families, of which the bandpass keeps the family around
        the picked sideband.

  relationships:
    - name: sideband-selection
      description: |
        The ring output contains f(1 + r) and f(1 - r) and no carriers; the
        bandpass keeps the sum sideband, so a single melodic tone survives
        where osc-ring-mod-cross keeps the whole clangorous pair.
    - name: filter-versus-ratio-lock
      description: |
        difference-tone-bass lands the difference sideband on the
        fundamental through exact integer ratios and needs no filter; this
        technique picks the sum sideband through a tracked bandpass, so
        arbitrary intervals work and the result is a bright partial above
        the note, not a bass.
    - name: key-lock
      description: |
        The cutoff is tracked by fscale, one of the permitted cutoff_mod_in
        sources next to note, fadsr and fm; because the tracking factor
        equals 1 + r, the pick stays centred on the sum sideband across the
        whole keyboard.
    - name: budget
      description: |
        Registry budgets: note = 1, osc <= 8 (used 2), fscale <= 8 (used
        2), ring <= 4 (used 1), filter <= 8 (used 1), output = 1.

  perceptual_effects:
    - one clean, key-locked inharmonic tone from a clangorous ring pair
    - tunable bell partial that tracks the played key
    - band-limited metallic sheen from saw-fed ring pairs