technique:
  name: fscale-fm-harmonic-shift

  idea: |
    The frequency scaler sits between the note source and the FM stage, so
    the whole modulation cluster runs on a harmonic of the played key: the
    scaler multiplies the note by a fixed factor and the FM stage builds its
    deviation around that shifted centre.  The rendered voice therefore sits
    an octave or a fifth above the keyboard while the modulator oscillator,
    still fed by the raw note, stays locked to the original pitch ratio.

  involved_nodes:
    - type: note
      role: MIDI note source; feeds both the scaler and the modulator.
    - type: fscale
      role: Frequency scaler; shifts the FM cluster's centre onto a harmonic.
    - type: osc
      role: Modulator oscillator in pitch mode; tracks the raw note.
    - type: fm
      role: Proportional FM stage; deviates the shifted centre.
    - type: osc
      role: Carrier oscillator in pitch mode; renders the shifted voice.
    - type: output
      role: Summing endpoint.

  involved_ports:
    - node_role: MIDI note source
      port: out
      role: Note frequency into the scaler and the modulator (frequency).
    - node_role: Frequency scaler
      port: freq_in
      role: Receives the note frequency (frequency).
    - node_role: Frequency scaler
      port: out
      role: Harmonically shifted frequency into the FM stage (frequency).
    - node_role: Modulator oscillator
      port: note_in
      role: Receives the raw note frequency (frequency).
    - node_role: Modulator oscillator
      port: out
      role: Modulator signal into the FM stage (signal).
    - node_role: FM stage
      port: freq_in
      role: Receives the shifted centre frequency (frequency).
    - node_role: FM stage
      port: modulator_in
      role: Receives the modulator signal (signal).
    - node_role: FM stage
      port: out
      role: Shifted, modulated frequency towards the carrier (frequency).
    - node_role: Carrier oscillator
      port: note_in
      role: Receives the modulated frequency (frequency).
    - node_role: Carrier oscillator
      port: out
      role: Rendered signal towards the output (signal).
    - node_role: Master output
      port: in1..in8
      role: One mix input for the shifted voice (signal).

  topology:
    description: |
      note -> fscale.freq_in (frequency).  fscale.out -> fm.freq_in
      (frequency).  note -> modulator.note_in (frequency), modulator.out ->
      fm.modulator_in (signal).  fm.out -> carrier.note_in (frequency),
      carrier.out -> output (signal).  The scaler moves the cluster's
      centre; the modulator stays on the raw key so the deviation keeps its
      musical ratio to the played note.

  parameters:
    - name: fscale factor
      role: |
        0..10.  2 places the voice an octave up, 3 an octave plus a fifth,
        1.5 a fifth; non-integer factors stretch the ratios and detune the
        cluster against the keyboard.
    - name: fm amount
      role: |
        Modulation index, 0..10.  Sets how hard the shifted centre is
        deviated by the modulator.
    - name: modulator and carrier waveforms
      role: |
        Rendered waveforms; richer waveforms thicken the sidebands of the
        shifted cluster.

  relationships:
    - name: shifted-cluster
      description: |
        The scaler moves only the FM centre, not the modulator, so the
        modulator-to-carrier ratio changes with the factor and the rendered
        spectrum re-colours as the voice is lifted.
    - name: modulation-domain-sibling
      description: |
        fscale-organ-stack doubles by rendering a second scaled voice;
        here the scaler works inside the FM cluster and no second rendered
        voice exists.  fadsr-fm-spectrum-sweep sweeps the same socket with
        an envelope; this technique holds a static factor.
        shaped-modulator-fm instead re-shapes the modulator signal itself
        for sideband density, while the scaler here moves the cluster's
        centre and leaves the modulator waveform untouched.
    - name: budget
      description: |
        Registry budgets: note = 1, fscale <= 8, osc <= 8, fm <= 4,
        output = 1.

  perceptual_effects:
    - FM voice placed an octave or fifth above the keyboard
    - brighter, floating harmonic placement of a familiar patch
    - detuned, non-integer factors for stretched-tuning colour