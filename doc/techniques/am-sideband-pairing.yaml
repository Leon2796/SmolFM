technique:
  name: am-sideband-pairing

  idea: |
    Audio-rate amplitude modulation between two note-derived oscillators.
    The AM stage biases the bipolar modulator into a positive gain range,
    so the carrier stays audible and sidebands appear at carrier plus and
    minus modulator frequency — a clangorous but tonal partial stack
    around a stable centre, where ring modulation (the carrier-suppressing
    limit case without bias) would dissolve the pitch.  A ratio-driven
    modulator keeps the pair note-locked: note through fscale sets the
    modulator-to-fundamental ratio, so the sideband distances scale with
    the played key.  This is the amplitude-domain sibling of
    classic-two-op-fm and the carrier-preserving opposite of
    osc-ring-mod-cross; at LFO rates the same stage degenerates into plain
    tremolo (am-tremolo-lfo).

  involved_nodes:
    - type: note
      role: MIDI note source; base frequency for both voices.
    - type: fscale
      role: Ratio scale stage for the note-locked modulator voice.
    - type: osc
      role: Carrier oscillator in pitch mode; the surviving centre of the
        pair.
    - type: osc
      role: Modulator oscillator; audio-rate amplitude modulator of the
        pair.
    - type: am
      role: AM stage; biased modulation keeps the carrier audible while the
        swing adds the sidebands.
    - type: output
      role: Summing endpoint.

  involved_ports:
    - node_role: MIDI note source
      port: out
      role: Base frequency into both voices (frequency).
    - node_role: Ratio scale stage
      port: freq_in
      role: Receives the note frequency (frequency).
    - node_role: Ratio scale stage
      port: out
      role: Ratio-scaled frequency into the modulator voice (frequency).
    - node_role: Carrier oscillator
      port: note_in
      role: Receives the note frequency (frequency).
    - node_role: Carrier oscillator
      port: out
      role: Carrier signal into the AM stage (signal).
    - node_role: Modulator oscillator
      port: note_in
      role: Receives the ratio-scaled frequency (frequency).
    - node_role: Modulator oscillator
      port: out
      role: Modulator signal into the AM stage (signal).
    - node_role: AM stage
      port: carrier_in
      role: Receives the carrier signal (signal).
    - node_role: AM stage
      port: modulator_in
      role: Receives the audio-rate modulator (signal).
    - node_role: AM stage
      port: out
      role: Paired signal towards the output (signal).
    - node_role: Master output
      port: in1..in8
      role: One mix input for the pair (signal).

  topology:
    description: |
      note -> carrier.note_in (frequency); for a note-locked pair also
      note -> fscale.freq_in -> modulator.note_in (frequency), or a static
      modulator frequency instead.  carrier.out -> am.carrier_in
      (signal).  modulator.out -> am.modulator_in (signal).  am.out ->
      output (signal).  The two voices meet only in the AM stage; in
      front of it they stay independent.

  parameters:
    - name: am amount
      role: |
        Modulation depth, 0..1.  0 = dry carrier; deeper values grow the
        sidebands while the bias keeps the carrier audible at any depth.
    - name: modulator ratio
      role: |
        fscale factor, 0..10.  Integer ratios keep the sideband distances
        harmonic; non-integer ratios place them inharmonically.
    - name: voice waveforms
      role: |
        Waveforms of carrier and modulator; the modulator's richness
        shades the sideband structure.

  relationships:
    - name: sidebands-plus-carrier
      description: |
        The AM output keeps the carrier at a reduced level and adds
        sidebands at f_c ± f_m; the pitch survives even at full depth,
        unlike ring modulation, which suppresses the carrier entirely.
    - name: ratio-tracking
      description: |
        With the fscale ratio the modulator follows the note, so the
        sideband distances stay musically related across the keyboard; a
        static modulator instead lets the ratio drift as the melody
        moves.
    - name: budget
      description: |
        Registry budgets: note = 1, fscale <= 8, osc <= 8, am <= 4,
        output = 1.  One pair costs two voices and one AM stage.

  perceptual_effects:
    - clangorous, bell-adjacent tones that keep a clear fundamental
    - growling harmonic thickening as the depth rises
    - note-locked inharmonic colouring with non-integer ratios
    - a stable centre pitch where ring modulation would go hollow