technique:
  name: fscale-temper-beating

  idea: |
    Two note-tracking branches sit one deliberately defined cent distance
    apart: one branch uses a pure rational factor, the other the matching
    named 12-TET interval.  Their small difference produces a slow
    amplitude beating that scales with the played key.  The classic case
    pairs the pure fifth (factor 1.5) with the tempered fifth (interval
    fifth_up, 1.4983) — roughly two cents apart, so the beat rate is
    proportional to the note frequency and the tone breathes like a
    celeste organ register, note for note, without any modulator.

  involved_nodes:
    - type: note
      role: Keyboard send; the single pitch reference both branches track.
    - type: fscale
      role: Pure branch stage; a plain factor holds the non-tempered ratio (e.g. 1.5).
    - type: fscale
      role: Temper branch stage; the named interval holds the exact 12-TET ratio (e.g. fifth_up = 2^(7/12)).
    - type: osc
      role: Pure branch voice in pitch mode.
    - type: osc
      role: Temper branch voice in pitch mode.
    - type: output
      role: Sums both branches into one beating tone.

  involved_ports:
    - node_role: Keyboard send
      port: out
      role: Base frequency fan-out into both branches (frequency).
    - node_role: Pure branch stage
      port: freq_in
      role: Receives the base frequency (frequency).
    - node_role: Pure branch stage
      port: out
      role: Pure interval frequency into its voice (frequency).
    - node_role: Temper branch stage
      port: freq_in
      role: Receives the base frequency (frequency).
    - node_role: Temper branch stage
      port: out
      role: Tempered interval frequency into its voice (frequency).
    - node_role: Pure branch voice oscillator
      port: note_in
      role: Receives the pure interval frequency (frequency).
    - node_role: Pure branch voice oscillator
      port: out
      role: Pure component into one output input (signal).
    - node_role: Temper branch voice oscillator
      port: note_in
      role: Receives the tempered interval frequency (frequency).
    - node_role: Temper branch voice oscillator
      port: out
      role: Tempered component into one output input (signal).
    - node_role: Master output
      port: in1..in8
      role: Dedicated mix inputs for the pair; input levels balance the beating (signal).

  topology:
    description: |
      note.out -> fscale1.freq_in (frequency), fscale1.out (factor 1.5)
      -> osc1.note_in.  note.out -> fscale2.freq_in (frequency),
      fscale2.out (interval fifth_up) -> osc2.note_in.  osc1.out ->
      output.in1 (signal), osc2.out -> output.in2 (signal).  The two
      branches are parallel and share only the note send; no modulation
      nodes are involved.

  parameters:
    - name: pure factor
      role: |
        Plain multiplier 0..10 of the first branch (e.g. 1.5 pure fifth,
        1.25 pure major third, 0.75 pure fourth).
    - name: temper interval
      role: |
        Named 12-TET option of the second branch (fifth_up, fourth_down,
        major_third_up, ...), each the exact ratio 2^k/12; identical
        pairs collapse the beating to silence.
    - name: branch waveforms
      role: |
        Waveforms of both voices (sine, saw, square, triangle, noise,
        perlin, simplex).  Identical waveforms beat cleanly; differing
        waveforms roughen the beat per partial.

  relationships:
    - name: temper-beat-rate
      description: |
        The beat frequency is the absolute difference of the two branch
        frequencies, f times (1.5 - 2^(7/12)) ≈ 0.0017 f for the fifth —
        about 0.37 Hz at A3 and 0.74 Hz at A4.  The beating therefore
        tracks the keyboard instead of running at a fixed rate.
    - name: identical-pair-collapse
      description: |
        Matching both branches exactly (interval plus factor for the same
        total ratio) silences the beating, which turns the pair into a
        plain stack and exposes the temper offset as the single audible
        cause.
    - name: note-tracking-sibling
      description: |
        static-detune-beating detunes two static oscillators in hertz and
        never locks to a note; here both branches are note-tracking, so
        the widening stays musical.  fscale-organ-stack stacks rational
        ratios as drawbars with no beating intent.
    - name: budget
      description: |
        Registry budgets: note = 1, fscale <= 8, osc <= 8, output = 1.

  perceptual_effects:
    - warm celeste widening that beats slower on low keys, faster on high
    - organ- and harmonium-like tuning breath
    - key-tracking chorus without any modulator
    - clean collapse to an exact interval stack when both branches match