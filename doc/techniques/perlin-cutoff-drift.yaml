technique:
  name: perlin-cutoff-drift

  idea: |
    A noise-family oscillator in LFO mode feeds the proportional FM stage,
    and the FM output lands on the filter's cutoff modulation input.  The
    cutoff follows the centre times (1 + amount * modulator), so the filter
    opens and closes with smooth, non-repeating wander around the static
    base frequency - the voice breathes through a filter that never loops,
    while periodic sine wobbling would flicker on a fixed cycle.

  involved_nodes:
    - type: note
      role: MIDI note source; base frequency for the drift FM stage.
    - type: osc
      role: Drift oscillator in LFO mode with perlin or simplex waveform;
        the wandering modulation source.
    - type: fm
      role: Proportional FM stage; turns the drift into a centre-scaled
        cutoff motion.
    - type: osc
      role: Voice oscillator in pitch mode; the signal being filtered.
    - type: filter
      role: Filter stage with a static base cutoff; its live cutoff is
        overridden by the drift signal.
    - type: output
      role: Summing endpoint.

  involved_ports:
    - node_role: MIDI note source
      port: out
      role: Base frequency into the drift FM stage (frequency).
    - node_role: Drift oscillator
      port: out
      role: Wandering modulator signal into the FM stage (signal).
    - node_role: FM stage
      port: freq_in
      role: Receives the base frequency (frequency).
    - node_role: FM stage
      port: modulator_in
      role: Receives the drift signal (signal).
    - node_role: FM stage
      port: out
      role: Drifting cutoff signal into the filter (frequency).
    - node_role: Voice oscillator
      port: note_in
      role: Receives the played note frequency (frequency).
    - node_role: Voice oscillator
      port: out
      role: Voice signal into the filter (signal).
    - node_role: Filter stage
      port: in
      role: Receives the voice signal (signal).
    - node_role: Filter stage
      port: cutoff_mod_in
      role: Receives the drifting cutoff override (frequency).
    - node_role: Filter stage
      port: out
      role: Drift-filtered signal towards the output (signal).
    - node_role: Master output
      port: in1..in8
      role: One mix input for the filtered voice (signal).

  topology:
    description: |
      note -> fm.freq_in (frequency).  Drift oscillator (LFO mode, perlin
      or simplex) -> fm.modulator_in (signal).  fm.out ->
      filter.cutoff_mod_in (frequency).  voice osc.out -> filter.in
      (signal).  filter.out -> output (signal).  The modulation input
      overrides the static cutoff, so the drift is the live cutoff and the
      static cutoff parameter is the untouched base centre.

  parameters:
    - name: drift rate
      role: |
        LFO rate, 0.01..50 Hz.  0.05..0.5 Hz breathes slowly, faster rates
        ripple the filter without periodicity.
    - name: fm amount
      role: |
        Modulation index, 0..10.  0.2..1 spans the drift around the centre
        in musical proportion to the base cutoff.
    - name: filter mode and cutoff
      role: |
        lp, hp, bp or notch; the static cutoff (20..20000 Hz) is the base
        centre around which the drift moves.
    - name: filter resonance
      role: |
        0..1.  Higher values make the wandering cutoff audible as a swept
        resonance.
    - name: voice waveform
      role: |
        Rendered waveform of the filtered voice.

  relationships:
    - name: override-semantics
      description: |
        A connected cutoff_mod_in overrides the static cutoff frequency;
        the FM stage therefore defines the absolute cutoff as centre times
        (1 + amount * modulator), keeping the drift a fixed proportional
        band around the base centre.
    - name: filter-path-sibling
      description: |
        lfo-cutoff-wobble sweeps the same input with a periodic sine;
        fadsr-cutoff-sweep drives the same input with a deterministic note
        envelope; perlin-drift-modulation feeds the same drift source into
        the pitch path instead of the filter path, and
        perlin-tremolo-breath keeps the noise-family LFO in the amplitude
        domain.  Here the wander is non-periodic and lives in the timbre,
        not the pitch or the loudness.
    - name: budget
      description: |
        Registry budgets: note = 1, osc <= 8, fm <= 4, filter <= 8,
        output = 1.  One drift stage can fan out into several filters for
        correlated motion across voices.

  perceptual_effects:
    - breathing, organic filter motion without loop artefacts
    - slowly evolving timbral shading behind sustained notes
    - restless, non-repeating resonance flicker at higher rates