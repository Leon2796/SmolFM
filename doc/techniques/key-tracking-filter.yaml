technique:
  name: key-tracking-filter

  idea: |
    The filter's cutoff modulation input is fed directly from the note
    source: the live cutoff equals the played frequency, optionally scaled
    by an fscale ratio.  A connected cutoff port replaces the static
    cutoff entirely, so the filter stops being a fixed tone control and
    becomes a proportional one — the ratio between cutoff and fundamental
    is fixed by the tracking scale, and every key keeps the same relative
    timbre across the whole keyboard.  No envelope, no LFO: the note
    itself is the frequency-domain control signal.  Where
    fadsr-cutoff-sweep sweeps the band over time, this technique holds the
    band in a fixed relationship and lets the melody move it.

  involved_nodes:
    - type: note
      role: MIDI note source; its out port fans out to the voice and to the
        filter's cutoff input.
    - type: fscale
      role: Optional tracking scale between note and cutoff input; its
        factor fixes the cutoff-to-fundamental ratio (1 = plain tracking).
    - type: osc
      role: Voice in pitch mode; renders the tracked signal.
    - type: filter
      role: SVF whose live cutoff equals the tracked note frequency; mode
        and resonance colour the fixed-ratio band.
    - type: output
      role: Summing endpoint.

  involved_ports:
    - node_role: MIDI note source
      port: out
      role: Base frequency into the voice and the tracking stage
        (frequency).
    - node_role: Tracking scale stage
      port: freq_in
      role: Receives the note frequency (frequency).
    - node_role: Tracking scale stage
      port: out
      role: Ratio-scaled frequency as the live cutoff (frequency).
    - node_role: Voice oscillator
      port: note_in
      role: Receives the plain note frequency (frequency).
    - node_role: Voice oscillator
      port: out
      role: Voice signal into the filter (signal).
    - node_role: Filter stage
      port: in
      role: Receives the voice signal (signal).
    - node_role: Filter stage
      port: cutoff_mod_in
      role: Receives the tracked live cutoff; connected, it replaces the
        static cutoff (frequency).
    - node_role: Filter stage
      port: out
      role: Tracked signal towards the output (signal).
    - node_role: Master output
      port: in1..in8
      role: One mix input for the voice chain (signal).

  topology:
    description: |
      note -> osc.note_in (frequency) and, in the plain variant, note ->
      filter.cutoff_mod_in (frequency); with a tracking ratio, note ->
      fscale.freq_in (frequency) and fscale.out -> filter.cutoff_mod_in
      (frequency) instead.  osc.out -> filter.in (signal).  filter.out ->
      output (signal).  The control wire lives entirely in the frequency
      domain and meets the audio path only at the filter, where the
      tracked value replaces the static cutoff.

  parameters:
    - name: tracking ratio
      role: |
        fscale factor, 0..10, between note and cutoff.  1 rides the
        fundamental itself (dark, hollow), 2 places the band an octave
        above (open, bright), 0.5 an octave below; the plain variant
        without fscale is ratio 1.
    - name: filter character
      role: |
        mode lp | bp | hp | notch and resonance 0..1.  bp or notch on the
        tracking band emphasises a formant peak that follows the melody.
    - name: voice waveform
      role: |
        Waveform of the tracked voice; the fixed-ratio band selects a
        constant share of it on every key.

  relationships:
    - name: cutoff-replacement
      description: |
        A connected cutoff_mod_in is the live cutoff in Hz and replaces
        the static cutoff parameter entirely (no offset or blend); the
        frequency is clamped to 20..20000 Hz, so extreme factors bottom
        out at the audible floor.
    - name: proportional-timbre
      description: |
        Cutoff divided by note frequency is fixed by the tracking scale;
        unlike a static cutoff, low notes do not become proportionally
        darker and high notes not brighter — the spectral character is a
        property of the instrument, not of the key.
    - name: budget
      description: |
        Registry budgets: note = 1, fscale <= 8, osc <= 8, filter <= 8,
        output = 1.  One voice chain plus one control wire.

  perceptual_effects:
    - same relative brightness and resonance on every key
    - formant-like emphasis that follows the melody
    - hollow, nasal lp tracking when the cutoff rides the fundamental