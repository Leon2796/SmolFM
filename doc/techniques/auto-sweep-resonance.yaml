technique:
  name: auto-sweep-resonance

  idea: |
    A saw-shaped LFO sweeps the filter's resonance as a repeated ramp: each
    cycle the Q starts closed and climbs to full drive, then snaps back — a
    cyclic "squelch-and-snap" that turns every note into a rhythmic filter
    zipper without touching pitch or amplitude.  The ramp pattern is the
    saw-resonance-pulse graph in full; this technique keeps it as an explicit
    technique import and holds only its own sound-design framing.  It is the
    same klang as saw-resonance-pulse — keep this entry as the name-compatibility alias and prefer the original for new instruments.

  tutorial: |
    Auto-Sweep-Resonanz — der zyklische Resonanzsweep, in der Literatur als
    rhythmisches Filter-Zipper bzw. Q-Rampe bekannt. Wofür dient die
    Verdrahtung? Eine Sägezahn-LFO rampt die Resonanz (Q) des Filters pro
    Zyklus von geschlossen auf volle Antrieb und schnappt zurück. Was ist
    das Ziel? Jede Note wird zum rhythmischen Filter-Zipper — Squelch und
    Snap im Takt der Rampe, ohne Tonhöhe oder Lautheit anzutasten. Der
    Gang des Signals: (1) Die Stimme spielt ihre Wellenform samt Obertönen.
    (2) Das Filter formt: die kletternde Q öffnet die Resonanzpeaks, das
    Ohr liest aufsteigende Rauheit und den Snap beim Rücksetzten; übersteigt
    die Rampe die Schwelle, pingt Selbstschwingen. (3) Der Ausgang trägt
    das Ergebnis. Die graf bleibt wortwörtlich die von
    saw-resonance-pulse — voller Import desselben Klangbilds; dieser
    Eintrag dient als Namenskompatibilitäts-Alias, für neue Instrumente
    lieber das Original.

  imports:
    - name: saw-resonance-pulse
      reuses: |
        The complete graph: ramp osc (lfo mode, saw) -> filter.resonance_mod_in,
        voice osc -> filter.in, filter.out -> output, voice pitched by the
        keyboard note, optional note -> filter.cutoff_mod_in key tracking.
        Also the parameter roles (ramp rate, static resonance, cutoff, filter
        mode) and the ramp-to-snap relationship.
      delta: |
        Framing only: the "squelch-and-snap" wording and the pattern-generator
        reading of the ramp.  (The former "key-tracked cutoff through the
        static scale" claim and the stale osc/filter <= 8 budgets were faults
        of this duplicated copy; the import carries the wired original — its
        optional key-track wire and its correct budget 16s.)

  graph_ascii: |
      [ import: saw-resonance-pulse ] — full graph verbatim:
        (osc · lfo saw ramp) ──out──▶ (filter.resonance_mod_in)
        (osc · steady voice) ──out──▶ (filter.in)
        (filter) ──out──▶ (output)
        (note) ──out──▶ (osc.note_in)    ┄ and optional ──▶ (filter.cutoff_mod_in)

  perceptual_effects:
    - cyclic squelch-and-snap on every note, rhythmic without any sequencer
    - resonance-driven ratchet texture rising inside each LFO cycle
    - pitched self-oscillation pings when the climb crosses the threshold