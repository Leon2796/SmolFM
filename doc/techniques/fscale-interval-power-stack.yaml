technique:
  name: fscale-interval-power-stack

  idea: |
    One keyboard send fans its frequency out through scale stages that use
    named musical intervals, so a single key sounds as a stacked chord of
    tempered relations: fundamental, fifth and octave (or any other
    interval selection), each rendered by its own oscillator and balanced
    by its own output input level.  Where fscale-organ-stack derives a
    pure overtone series from rational factors, every branch here sits an
    exact named 12-TET interval away from the key, so the stack reads as a
    chord voicing or drone — fifths, octaves, fourths — locked to the
    played note everywhere on the keyboard.

  involved_nodes:
    - type: note
      role: Keyboard send; the single pitch reference every interval branch derives from.
    - type: fscale
      role: Interval branch stage; its interval names the branch's musical distance to the key.
    - type: osc
      role: Branch voice in pitch mode rendering one chord member.
    - type: output
      role: Master merge; one dedicated input per branch, the input levels balance the chord stack.

  involved_ports:
    - node_role: Keyboard send
      port: out
      role: Base frequency fan-out into every interval branch (frequency).
    - node_role: Interval branch stage
      port: freq_in
      role: Receives the base frequency (frequency).
    - node_role: Interval branch stage
      port: out
      role: Interval-transposed frequency into the branch voice (frequency).
    - node_role: Branch voice oscillator
      port: note_in
      role: Receives the branch frequency (frequency).
    - node_role: Branch voice oscillator
      port: out
      role: Chord member into one output input (signal).
    - node_role: Master output
      port: in1..in8
      role: One dedicated mix input per branch; input levels set the chord balance (signal).

  topology:
    description: |
      note.out -> fscale1.freq_in (frequency), fscale1.out (interval
      fifth_up) -> osc1.note_in.  note.out -> fscale2.freq_in,
      fscale2.out (interval octave_up) -> osc2.note_in.  The
      untransposed fundamental runs straight to its voice:
      note.out -> osc0.note_in.  All osc.out ports feed dedicated output
      inputs (signal); the per-input levels are the mix faders and the
      master level scales the whole stack.  Branches are strictly
      parallel and share only the note send.

  parameters:
    - name: interval per branch
      role: |
        Named 12-TET option per fscale stage (none, octave_up,
        octave_down, fifth_up, fifth_down, fourth_up, fourth_down,
        minor_third_up, major_third_up, semitone_up, semitone_down);
        each stands for the exact ratio 2^k/12 and none leaves the
        branch transparent on its plain factor.
    - name: branch factor
      role: |
        Free multiplier 0..10 after the interval.  1 keeps the pure
        interval; 1.00113 corrects the tempered fifth (2^(7/12) =
        1.4983) to the pure ratio 1.5, cent offsets detune the branch
        against the stack.
    - name: branch waveforms
      role: |
        One waveform per voice (sine, saw, square, triangle, noise,
        perlin, simplex).  Sine voices keep the chord hollow and organ
        like; saw or square voices thicken each member with its own
        overtone series.
    - name: branch levels and master level
      role: |
        Output input level 0..1 per branch plus output level 0..1; the
        balance between chord members and the overall stack.

  relationships:
    - name: interval-times-factor
      description: |
        A branch's total distance to the key is the product of its
        interval ratio 2^k/12 and its factor 0..10.  Named intervals
        place the stack musically (tempered fifth, octave, fourth); the
        factor trims cents or stretches the placement inharmonic.
    - name: chord-versus-overtone-sibling
      description: |
        fscale-organ-stack voices the same fan-out with rational integer
        factors as a pure harmonic drawbar series; this technique
        instead places named tempered intervals so the stack sounds as
        a chord or drone.  pitch-related-instrument frames the general
        frequency-family send; the interval stack is its chord-voiced
        focus.
    - name: budget
      description: |
        Registry budgets: note = 1, fscale <= 8, osc <= 8, output = 1.
        Three interval voices fit easily; up to eight chord members fit
        under one output (one input per voice).

  perceptual_effects:
    - stacked open fifths, octaves and fourths from one key press
    - drone, bagpipe and power-chord voicings locked to the played key
    - chord tint that follows the keyboard in exact tempered ratios
    - optional pure-temper trim via the factor for just-intonation stacks