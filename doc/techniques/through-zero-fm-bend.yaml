technique:
  name: through-zero-fm-bend

  idea: |
    A deep FM amount swings the frequency factor (1 + a*m) clean through
    zero: the carrier's momentary frequency crosses 0 Hz, runs negative and
    the phase accumulator simply runs backwards — the oscillator wraps the
    phase without any discontinuity, even for saw, square and triangle.  The
    result is the classic through-zero FM sweep: a dive that folds through
    silence into an inverted-phase rise instead of choking at zero depth.
    Static mode keeps the modulator ratio hard-locked so every note dives
    the same way.

  involved_nodes:
    - type: note
      role: Keyboard send; the carrier centre frequency.
    - type: osc
      role: Modulator in static mode, sine at a musical ratio.
    - type: fm
      role: The FM stage; its depth is pushed deep enough to cross zero.
    - type: osc
      role: Carrier oscillator integrating the swept frequency.
    - type: output
      role: Master endpoint.

  involved_ports:
    - node_role: Keyboard send
      port: out
      role: Centre frequency into the FM stage (frequency).
    - node_role: Modulator
      port: out
      role: Full-swing modulator into modulator_in (signal).
    - node_role: FM stage
      port: freq_in
      role: Receives the centre frequency (frequency).
    - node_role: FM stage
      port: out
      role: Signed momentary frequency into the carrier (frequency).
    - node_role: Carrier oscillator
      port: note_in
      role: Integrates the swept frequency, backwards when negative (frequency).
    - node_role: Carrier oscillator
      port: out
      role: Rendered waveform towards the output (signal).

  topology:
    description: |
      note.out -> fm.freq_in (frequency).  mod-osc.out (static mode, sine,
      staticfreq at the ratio; e.g. 440 Hz or a fscale-mixed ratio) ->
      fm.modulator_in (signal).  fm.out -> carrier-osc.note_in (frequency).
      carrier-osc.out -> output.in1 (signal).  One FM stage and one carrier
      integrate the signed frequency directly; no extra nodes are needed.

  parameters:
    - name: fm amount
      role: |
        0..10.  The zero crossing needs a >= 2.2 with a sine modulator
        (factor 1 + a*m reaches 0); moderate 1.5 stays one-sided TZ-ish,
        4..8 gives wide through-zero dives.
    - name: modulator ratio
      role: |
        staticfreq vs the played note, e.g. 1:1 for clean dives, 2:1 for a
        two-sided bell swing; keep integer or fscale-locked ratios so the
        dive repeats note after note.
    - name: modulator waveform
      role: |
        Sine keeps the crossing smooth; triangle slows the sweep near zero;
        square snaps through zero instantly (an audible polarity flip).

  relationships:
    - name: zero-crossing
      description: |
        The factor (1 + a*m) becomes negative for a portion of every
        modulator cycle when a > 1/|m_peak|.  The oscillator clamps the
        momentary frequency to [-fs/2, fs/2], lets the phase run backwards
        and wraps it per fmod — the wave folds through silence cleanly.
    - name: carrier-stability
      description: |
        Sine carriers stay continuous at any depth; saw/square/triangle
        carriers fold without clicks because the wrap is discontinuity-free
        (through-zero), unlike naive hard-FM fold-over.  Keep amounts < 1.5
        only when a smooth one-sided sweep is wanted.
    - name: budget
      description: |
        Registry budgets: note = 1, osc <= 16 (two used), fm <= 8 (one
        used), output = 1.

  perceptual_effects:
    - bass dives that bend through silence and rise inverted in phase
    - gong-like TZ-FM sweeps with no stalling at the crossing point
    - clean reversed-phase shimmer instead of FM fold-over noise