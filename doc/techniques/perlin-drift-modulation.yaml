technique:
  name: perlin-drift-modulation

  idea: |
    A noise-family oscillator in LFO mode replaces the periodic modulator:
    fed into the proportional FM stage it bends the carrier with smooth,
    non-repeating wander instead of a fixed shape.  Because the FM stage
    computes out = f_in * (1 + amount * modulator), the drift depth scales
    with the played note, so the wander stays musically placed on every
    key — a living, imperfect intonation rather than a locked vibrato.
    Sine in the same socket gives periodic vibrato; the noise family gives
    organic drift that never loops.

  involved_nodes:
    - type: note
      role: MIDI note source; carrier frequency for the FM stage.
    - type: osc
      role: Drift oscillator in LFO mode with perlin or simplex waveform;
        the wandering modulation source.
    - type: fm
      role: Proportional FM stage; turns the drift into a note-scaled pitch
        deviation.
    - type: osc
      role: Carrier oscillator in pitch mode; renders the drifting
        frequency.
    - type: output
      role: Summing endpoint.

  involved_ports:
    - node_role: MIDI note source
      port: out
      role: Base frequency into the FM stage (frequency).
    - node_role: Drift oscillator
      port: out
      role: Wandering modulator signal into the FM stage (signal).
    - node_role: FM stage
      port: freq_in
      role: Receives the note frequency (frequency).
    - node_role: FM stage
      port: modulator_in
      role: Receives the drift signal (signal).
    - node_role: FM stage
      port: out
      role: Drift-modulated frequency towards the carrier (frequency).
    - node_role: Carrier oscillator
      port: note_in
      role: Receives the modulated frequency (frequency).
    - node_role: Carrier oscillator
      port: out
      role: Rendered signal towards the output (signal).
    - node_role: Master output
      port: in1..in8
      role: One mix input for the voice (signal).

  topology:
    description: |
      note -> fm.freq_in (frequency).  Drift oscillator (LFO mode, perlin
      or simplex) -> fm.modulator_in (signal).  fm.out ->
      carrier.note_in (frequency).  carrier.out -> output (signal).  The
      drift source runs free of the note; only the proportional FM stage
      ties its effect back to the played frequency.

  parameters:
    - name: drift rate
      role: |
        LFO rate, 0.01..50 Hz.  Slow rates wander the intonation, fast
        rates shimmer restlessly without periodicity.
    - name: fm amount
      role: |
        Modulation index, 0..10.  Sets the drift depth as a proportion of
        the played note frequency.
    - name: drift waveform
      role: |
        perlin or simplex; both wander smoothly, differing in the
        character of their slopes.
    - name: carrier waveform
      role: |
        Rendered waveform of the drifting voice.

  relationships:
    - name: proportional-drift
      description: |
        The deviation equals amount times the note frequency, so the
        drift stays a fixed musical interval band around any key — not a
        fixed Hz band that grows or shrinks relative to the pitch.
    - name: non-periodic-return
      description: |
        Perlin and simplex wander has no loop length; the pitch drifts,
        leans and returns without phase artefacts, unlike the locked
        cycle of a sine vibrato.
    - name: budget
      description: |
        Registry budgets: note = 1, osc <= 8, fm <= 4, output = 1.  One
        drift stage per voice; several voices can share one drift source
        (fan-out into several fm modulator inputs) for correlated wander.

  perceptual_effects:
    - organic, hand-played-feeling pitch wobble
    - slowly drifting analogue-style intonation
    - restless shimmer at higher rates without periodic flicker